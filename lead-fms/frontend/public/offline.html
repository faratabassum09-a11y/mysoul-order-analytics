<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — Lead FMS</title>
  <meta name="theme-color" content="#1c2130" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#e7e9ef;text-align:center;
      font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(60vmax 40vmax at 10% 0%,rgba(232,114,46,.22),transparent 60%),radial-gradient(50vmax 40vmax at 100% 100%,rgba(138,63,208,.22),transparent 60%),linear-gradient(190deg,#1c2130,#12141d)}
    .card{width:min(440px,100%);padding:28px 26px 22px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
    @keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
    svg{width:176px;height:132px;overflow:visible;margin-bottom:12px}
    .arc{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;opacity:.25;animation:s 1.9s ease-in-out infinite}
    .a2{animation-delay:.22s}.a3{animation-delay:.44s}
    @keyframes s{0%,100%{opacity:.2}35%{opacity:.95}}
    .u,.x{stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:d .7s .25s ease forwards}
    .u{stroke:#1b1e2b;stroke-width:12}.x{stroke:#ff7a59;stroke-width:5}
    @keyframes d{to{stroke-dashoffset:0}}
    .chip{display:inline-block;margin-top:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:650;color:#ffd2b8;background:rgba(255,122,89,.14);border:1px solid rgba(255,122,89,.32)}
    h1{margin:14px 0 8px;font-size:28px;line-height:1.15;letter-spacing:-.02em;color:#fff}
    p{margin:0 auto;max-width:36ch;color:rgba(255,255,255,.72)}
    button{margin-top:20px;font:inherit;font-weight:600;color:#fff;cursor:pointer;padding:10px 20px;border:0;border-radius:11px;background:linear-gradient(135deg,#d95f1c,#b8431a);box-shadow:0 8px 22px rgba(0,0,0,.35)}
    button:active{transform:scale(.97)}
    small{display:block;margin-top:14px;color:rgba(255,255,255,.45);font-size:12px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.u,.x{stroke-dashoffset:0}.arc{opacity:.6}}
  </style>
</head>
<body>
  <main class="card" role="alert">
    <svg viewBox="0 0 160 120" aria-hidden="true">
      <path class="arc" d="M43.2 53.2A52 52 0 0 1 116.8 53.2"/>
      <path class="arc a2" d="M54.5 64.5A36 36 0 0 1 105.5 64.5"/>
      <path class="arc a3" d="M65.9 75.9A20 20 0 0 1 94.1 75.9"/>
      <circle cx="80" cy="90" r="5" fill="#fff"/>
      <line class="u" x1="53" y1="41" x2="107" y2="99"/><line class="x" x1="53" y1="41" x2="107" y2="99"/>
    </svg>
    <div><span class="chip">No connection</span></div>
    <h1>You're offline</h1>
    <p>Check your Wi-Fi or mobile data. This page reloads on its own as soon as your internet is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Lead FMS</small>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
    setInterval(function () { if (navigator.onLine) location.reload(); }, 8000);
  </script>
</body>
</html>
